name: Build Official GoatTV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore GoatTV signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GOATTV_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/GoatTV-release.jks"

      - name: Create signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.GOATTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOATTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GOATTV_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/GoatTV-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed GoatTV release APK
        run: ./gradlew assembleGithubRelease

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          cp "$APK" GoatTV-Mobile-v1.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoatTV-Mobile-v1.0
          path: GoatTV-Mobile-v1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: GoatTV Mobile v1.0
          files: GoatTV-Mobile-v1.0.apk
          generate_release_notes: true
