name: Build Official GoatTV APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore GoatTV signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GOATTV_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/GoatTV-release.jks"

      - name: Create signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.GOATTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOATTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GOATTV_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/GoatTV-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed GoatTV release APK
        run: ./gradlew assembleGithubRelease

      - name: Upload official GoatTV APK
        uses: actions/upload-artifact@v4
        with:
          name: GoatTV-Official-Release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
